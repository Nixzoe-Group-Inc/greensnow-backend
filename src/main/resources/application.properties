spring.application.name=worker
spring.profiles.active=dev

# JPA/Hibernate
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Datasource - set in application-dev.properties
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Jackson
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null

# Logging
logging.level.root=INFO
logging.level.com.greensnow.worker=DEBUG
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN

# API Documentation
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Application
app.name=Worker Platform
app.version=1.0.0
app.description=Real-time skill work marketplace

# Auth
app.auth.min-password-length=8
app.auth.password-reset-expiry-minutes=15
app.auth.max-reset-attempts=5

# Job
app.job.max-daily-duration-hours=8
app.job.max-extensions-allowed=3
app.job.extension-rate-multiplier=1.5
app.job.default-job-site-radius-meters=50

# Matching
app.matching.skill-weight=0.60
app.matching.experience-weight=0.25
app.matching.location-weight=0.10
app.matching.education-weight=0.05
app.matching.min-match-score=70

# Payment
app.payment.commission-percentage=12
app.payment.payment-processing-fee-percentage=3.4
app.payment.payment-processing-flat-fee=0.30

# Tracking
app.tracking.ping-interval-seconds=30
app.tracking.signal-loss-threshold-seconds=120
app.tracking.extension-response-timeout-minutes=30

# CORS
app.cors.allowed-origins=http://localhost:3000,http://localhost:3001
app.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true
app.cors.max-age=3600
